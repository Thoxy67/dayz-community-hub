[package]
name = "dayz-community-hub"
version.workspace = true
edition.workspace = true
description = "DayZ Community Hub"
authors.workspace = true

[lib]
name = "dayz_community_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Workspace shared
tokio.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
which.workspace = true
zip.workspace = true
clap.workspace = true
a2s.workspace = true
dayz-community-hub-core.workspace = true

# Tauri + plugins
tauri = { version = "2", features = ["protocol-asset", "native-tls"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = { version = "2", default-features = false, features = ["native-tls"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-single-instance = "2"

[target."cfg(not(windows))".dependencies]
zstd = { version = "0.13", features = ["pkg-config"] }

[target."cfg(windows)".dependencies]
zstd = "0.13"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
thiserror.workspace = true
minisign-verify = "0.2"

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.26"
