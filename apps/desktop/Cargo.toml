[package]
name = "dayz-community-hub"
description = "DayZ Community Hub: a server browser, mod manager and launcher for DayZ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "dzch_ui"
path = "src/lib.rs"

# The executable keeps the name every release has shipped (`dayz-community-hub`, `.exe`
# on Windows): the AppImage, the Windows zip, the AUR package, the updater's swap and the
# `dzch://` registrations all name it.
[[bin]]
name = "dayz-community-hub"
path = "src/main.rs"

[features]
default = []

[dependencies]
dz-hub = { workspace = true, features = ["mock"] }
dz-common.workspace = true
dz-api.workspace = true
dz-game.workspace = true
dz-profile.workspace = true
dz-steamworks.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
rustc-hash.workspace = true
# persistence: the window's size, position and maximised state (`platform::window`).
eframe = { workspace = true, features = ["wgpu", "wayland", "x11", "accesskit", "default_fonts", "persistence"] }
# Reads the saved window geometry (eframe's file) to drop values that would hurt startup.
ron = "0.12.2"
egui = { workspace = true, features = ["default_fonts"] }
resvg.workspace = true
rfd.workspace = true
open.workspace = true
# platform: the per-user directory of the single-instance files.
dirs.workspace = true
# i18n: the OS language on first run, and local dates.
sys-locale = "0.3.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The control channel: its random key, and `ui.screenshot`'s PNG.
getrandom = "0.3.4"
# Pictures the window loads at run time (parts/image.rs): the Steam avatar, friends'
# avatars, news images. Steam serves JPEG, the news WebP and PNG.
image = { workspace = true, features = ["jpeg", "webp"] }
base64.workspace = true
reqwest.workspace = true

# platform::tray and platform::notify on Linux: the StatusNotifierItem tray and desktop
# notifications over D-Bus, in pure Rust (zbus on async-io, as accesskit already runs
# it: no libdbus, no GTK, no libappindicator).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
notify-rust = { version = "4.18.2", default-features = false, features = ["z"] }
# platform::deck::detached: a link's opener without the AppImage's and the Steam
# session's variables, the way every other child is started.
dz-steamcmd.workspace = true

# platform::tray and platform::notify on Windows: Shell_NotifyIcon (windows-sys, no
# GTK) and WinRT toasts.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
# platform::tray: whether Explorer's notification area is there (FindWindowW), the
# same windows-sys tray-icon already links.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
notify-rust = { version = "4.18.2", default-features = false }
# platform::shortcut: a server's desktop shortcut as a .lnk, written in Rust (no COM).
mslnk = "0.1.8"

[build-dependencies]
# Windows only (build.rs returns early elsewhere): icon, VERSIONINFO and manifest.
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
image.workspace = true
