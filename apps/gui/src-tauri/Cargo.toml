[package]
name = "dayz-community-hub"
version.workspace = true
edition.workspace = true
description = "DayZ Community Hub"
authors.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "dayz_community_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
# Workspace shared
tokio.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
which.workspace = true
zip.workspace = true
clap.workspace = true
dz-common.workspace = true
dz-api.workspace = true
dz-a2s.workspace = true
dz-profile.workspace = true
dz-steamcmd.workspace = true
dz-game.workspace = true
dz-news.workspace = true
dz-battlemetrics.workspace = true
# The window's `bindings.ts`, generated from the commands' own signatures.
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true

# Tauri + plugins
tauri = { version = "2.12.0", features = ["protocol-asset", "native-tls"] }
tauri-plugin-opener = "2.6.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-clipboard-manager = "2.4.0"
tauri-plugin-single-instance = { version = "2.5.0", features = ["deep-link"] }
tauri-plugin-deep-link = "2.5.0"
lru = "0.18.5"
rustc-hash.workspace = true
sysinfo.workspace = true

[target."cfg(not(windows))".dependencies]
zstd = { version = "0.14.0", features = ["pkg-config"] }

[target."cfg(windows)".dependencies]
zstd = "0.14.0"
tauri-plugin-updater = "2.13.0"
tauri-plugin-process = "2.4.0"
thiserror.workspace = true
minisign-verify = "0.3.0"
self-replace = "1.5.0"

