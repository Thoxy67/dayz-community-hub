[workspace]

[package]
name = "dayzsa-gui"
version = "0.1.0"
description = "DayZ-SA Multi Launcher GUI"
authors = ["thoxy"]
edition = "2021"

[lib]
name = "dayzsa_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["native-tls"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dayzsa-core = { path = "../../dayzsa-core" }
a2s = { version = "0.6.1", features = ["async"] }
tokio-stream = { version = "0.1.18", features = ["full"] }
reqwest = { version = "0.13.2", features = ["rustls", "json", "query"] }
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.3.2"
