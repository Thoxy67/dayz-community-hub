[workspace]
members = [
    "dayz-community-hub-core",
    "dayz-community-hub-ui/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2024"
authors = ["thoxy"]

# ── Shared dependencies ────────────────────────────────────────────────────────

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "process", "fs", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# HTTP
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query"] }
# Low-level HTTP/1 client used only for the dayz.com news endpoint, which is
# Cloudflare-gated. Passing it requires mimicking a browser at three layers:
# a browser-like TLS fingerprint (rustls with a Firefox-ordered cipher/curve
# list), an advertised `http/1.1` ALPN, and title-cased HTTP/1.1 header names,
# none of which reqwest/native-tls produce. See `news::fetch_news_raw`.
# Uses the `ring` provider, not `aws-lc-rs`: aws-lc-sys compiles a BoringSSL-
# derived C library that fails to link under `lld` in release/packaging builds.
# `ring` links everywhere and clears the same Cloudflare check.
hyper = { version = "1.10", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Utilities
base64 = "0.22.1"
regex = "1.12"
which = "8"
sysinfo = "0.39"
chrono = { version = "0.4" }
clap = { version = "4.6", features = ["derive"] }
rustc-hash = "2.1"

# Compression / archive
zip = { version = "8.6", default-features = false, features = ["deflate", "deflate64"] }
flate2 = "1"
tar = "0.4"

# DayZ A2S queries
async-a2s = { git = "https://git.thoxy.xyz/thoxy/async-a2s" }

# Internal crates
dayz-community-hub-core = { path = "dayz-community-hub-core" }

# ── Profile overrides ─────────────────────────────────────────────────────────

[profile.dev]
incremental = true

# Optimize dependencies (not our own crates) even in dev. Tauri/reqwest/zstd
# are slow when built unoptimized; this makes `tauri dev` run far faster while
# keeping our own crates at opt-level 0 for a fast edit-compile loop.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
