[workspace]
members = [
    "dayz-community-hub-core",
    "dayz-community-hub-ui/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2024"
authors = ["thoxy"]

# ── Shared dependencies ────────────────────────────────────────────────────────

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "process", "fs", "net"] }
tokio-stream = { version = "0.1.18", features = ["sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# HTTP
reqwest = { version = "0.13.3", default-features = false, features = ["native-tls", "json", "query"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Utilities
base64 = "0.22.1"
regex = "1.12"
which = "8.0.2"
sysinfo = "0.39.1"
chrono = { version = "0.4.44" }
clap = { version = "4.6", features = ["derive"] }
rustc-hash = "2.1"

# Compression / archive
zip = { version = "8.6", default-features = false, features = ["deflate", "deflate64"] }
flate2 = "1"
tar = "0.4.45"

# DayZ A2S queries
async-a2s = { git = "https://git.thoxy.xyz/thoxy/async-a2s" }

# Internal crates
dayz-community-hub-core = { path = "dayz-community-hub-core" }

# ── Profile overrides ─────────────────────────────────────────────────────────

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
