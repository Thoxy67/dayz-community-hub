[package]
name = "dz-hub"
description = "The backend the launcher's window talks to: shared state, every command, the events, and a mock for screenshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# The invented world of `HubMode::Mock` (screenshots, ui_shot, `--mock`).
mock = []

[dependencies]
tokio.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
which.workspace = true
zip.workspace = true
clap.workspace = true
thiserror.workspace = true
rustc-hash.workspace = true
sysinfo.workspace = true
dirs.workspace = true
# Checks the updates' signatures (the AppImage and the Windows zip).
minisign-verify = "0.3.0"
dz-common.workspace = true
dz-api.workspace = true
dz-a2s.workspace = true
dz-profile.workspace = true
dz-steamcmd.workspace = true
dz-steamworks.workspace = true
dz-game.workspace = true
dz-news.workspace = true
dz-dayzmetrics.workspace = true
lru = "0.18.5"
# Controllers (Steam Deck, Xbox, PlayStation) for the gamepad navigation mode.
gilrs = "0.11.2"
# Watches the mod folders (inotify, ReadDirectoryChangesW), so the window
# reads them again when Steam or the player changes them, not on a timer.
notify-debouncer-full = { version = "0.7.0", default-features = false }

[target."cfg(not(windows))".dependencies]
zstd = { version = "0.14.0", features = ["pkg-config"] }

[target."cfg(target_os = \"linux\")".dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }

[target."cfg(windows)".dependencies]
zstd = "0.14.0"

[dev-dependencies]
# Paused clocks for the wake-on-change loops' tests.
tokio = { workspace = true, features = ["test-util"] }
# Signs test updates with a throwaway key, in the minisign format the release uses.
ed25519-dalek = "2.2.0"
blake2 = "0.10.6"
