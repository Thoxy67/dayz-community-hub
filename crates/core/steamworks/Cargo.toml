[package]
name = "dz-steamworks"
description = "Workshop downloads and the server list through the running Steam client (Steamworks ISteamUGC, ISteamMatchmakingServers), with Valve's library loaded on demand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
dz-common.workspace = true
# The shared process table: whether Steam runs, without a worker.
dz-steamcmd.workspace = true
libloading.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
# Never linked: it only puts Valve's redistributable library on disk, where
# the build script finds it and embeds the one for the target (see build.rs).
steamworks-sys.workspace = true
serde_json.workspace = true
