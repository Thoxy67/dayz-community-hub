name: Mirror releases to GitHub

on:
  workflow_dispatch:

concurrency:
  group: mirror-releases
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror all releases to GitHub
    runs-on: docker
    container:
      image: git.thoxy.xyz/thoxy/dayz-community-hub/ci:latest
      credentials:
        username: ${{ forgejo.repository_owner }}
        password: ${{ secrets.FORGEJO_TOKEN }}
    timeout-minutes: 30

    steps:
      - name: Mirror releases
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 << 'PYEOF'
          import sys, json, subprocess, os, urllib.parse

          FJ_TOKEN = os.environ["FORGEJO_TOKEN"]
          GH_TOKEN = os.environ["GH_PAT"]

          FJ_API = "https://git.thoxy.xyz/api/v1"
          FJ_OWNER = "thoxy"
          FJ_REPO = "dayz-community-hub"

          GH_API = "https://api.github.com"
          GH_UPLOAD = "https://uploads.github.com"
          GH_OWNER = "Thoxy67"
          GH_REPO = "dayz-community-hub"

          TMPDIR = subprocess.run(["mktemp", "-d"], capture_output=True, text=True).stdout.strip()

          def curl_json(args):
              r = subprocess.run(["curl", "-sf"] + args, capture_output=True, text=True)
              if r.returncode != 0:
                  return None
              return json.loads(r.stdout) if r.stdout.strip() else None

          def curl_status(url, headers):
              r = subprocess.run(
                  ["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}"] + headers + [url],
                  capture_output=True, text=True)
              return r.stdout.strip()

          def gh_upload_asset(release_id, filepath):
              name = os.path.basename(filepath)
              headers = ["-H", f"Authorization: token {GH_TOKEN}"]

              # Check for existing asset
              assets = curl_json(headers + [f"{GH_API}/repos/{GH_OWNER}/{GH_REPO}/releases/{release_id}/assets"])
              if assets:
                  for a in assets:
                      if a["name"] == name:
                          print(f"    Replacing existing asset: {name}")
                          subprocess.run(["curl", "-sf", "-X", "DELETE"] + headers +
                              [f"{GH_API}/repos/{GH_OWNER}/{GH_REPO}/releases/assets/{a['id']}"],
                              capture_output=True)
                          break

              encoded = urllib.parse.quote(name)
              r = subprocess.run(
                  ["curl", "-sf", "-X", "POST"] + headers +
                  ["-H", "Content-Type: application/octet-stream",
                   "--data-binary", f"@{filepath}",
                   f"{GH_UPLOAD}/repos/{GH_OWNER}/{GH_REPO}/releases/{release_id}/assets?name={encoded}"],
                  capture_output=True, text=True)
              if r.stdout.strip():
                  data = json.loads(r.stdout)
                  print(f"    Uploaded: {data.get('name', '?')}")
              else:
                  print(f"    ERROR uploading {name}: {r.stderr}")

          fj_headers = ["-H", f"Authorization: token {FJ_TOKEN}"]
          gh_headers = ["-H", f"Authorization: token {GH_TOKEN}"]

          # Fetch all releases from Forgejo (paginated)
          page = 1
          all_releases = []
          while True:
              batch = curl_json(fj_headers + [f"{FJ_API}/repos/{FJ_OWNER}/{FJ_REPO}/releases?page={page}&limit=50"])
              if not batch:
                  break
              all_releases.extend(batch)
              page += 1

          print(f"Found {len(all_releases)} releases on Forgejo")
          print()

          for rel in all_releases:
              tag = rel["tag_name"]
              print(f"=== Processing: {tag} ===")

              # Get full release details
              full = curl_json(fj_headers + [f"{FJ_API}/repos/{FJ_OWNER}/{FJ_REPO}/releases/{rel['id']}"])
              body = full.get("body", "") if full else ""
              name = rel.get("name", tag)
              is_pre = bool(rel.get("prerelease", False))
              is_draft = bool(rel.get("draft", False))

              print(f"  Name: {name}")
              print(f"  Prerelease: {is_pre}, Draft: {is_draft}")

              # Check if GitHub release exists
              status = curl_status(f"{GH_API}/repos/{GH_OWNER}/{GH_REPO}/releases/tags/{tag}", gh_headers)

              if status == "200":
                  gh_rel = curl_json(gh_headers + [f"{GH_API}/repos/{GH_OWNER}/{GH_REPO}/releases/tags/{tag}"])
                  gh_release_id = gh_rel["id"]
                  print(f"  Reusing GitHub release (id {gh_release_id})")
              else:
                  payload = {
                      "tag_name": tag,
                      "name": name,
                      "body": body or f"Release {tag}",
                      "draft": is_draft,
                      "prerelease": is_pre,
                  }

                  r = subprocess.run(
                      ["curl", "-s", "-X", "POST"] + gh_headers +
                      ["-H", "Content-Type: application/json",
                       f"{GH_API}/repos/{GH_OWNER}/{GH_REPO}/releases",
                       "-d", json.dumps(payload)],
                      capture_output=True, text=True)
                  if r.returncode != 0 or not r.stdout.strip():
                      print(f"  ERROR creating release: {r.stderr}")
                      continue
                  gh_rel = json.loads(r.stdout)
                  if "id" not in gh_rel:
                      print(f"  ERROR: {gh_rel.get('message', gh_rel)}")
                      continue
                  gh_release_id = gh_rel["id"]
                  print(f"  Created GitHub release (id {gh_release_id})")

              # Download and upload assets
              assets = curl_json(fj_headers + [f"{FJ_API}/repos/{FJ_OWNER}/{FJ_REPO}/releases/{rel['id']}/assets"])
              assets = assets or []
              print(f"  {len(assets)} assets to mirror")

              for asset in assets:
                  aname = asset["name"]
                  url = asset["browser_download_url"]
                  print(f"  Downloading: {aname}")
                  filepath = os.path.join(TMPDIR, aname)
                  subprocess.run(
                      ["curl", "-sfL"] + fj_headers + ["-o", filepath, url],
                      capture_output=True)

                  if not os.path.exists(filepath):
                      print(f"    ERROR: failed to download {aname}")
                      continue

                  gh_upload_asset(gh_release_id, filepath)
                  os.remove(filepath)

              print()

          subprocess.run(["rm", "-rf", TMPDIR], capture_output=True)
          print("Done! All releases mirrored to GitHub.")
          PYEOF
