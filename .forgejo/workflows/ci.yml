name: CI

on:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build check (Windows cross-compile)
    runs-on: docker
    container:
      image: git.thoxy.xyz/thoxy/dayz-community-hub/ci:latest
      credentials:
        username: ${{ forgejo.repository_owner }}
        password: ${{ secrets.FORGEJO_TOKEN }}
    timeout-minutes: 30

    defaults:
      run:
        working-directory: dayz-community-hub

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Cross-compile for Windows (no-bundle)
        env:
          # No signing during CI — TAURI_SIGNING_PRIVATE_KEY left unset so
          # Tauri skips signing but still compiles successfully with --no-bundle.
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: bun tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --no-bundle
