name: CI

# What a push to master must pass, the CI half of `make check`. Releases are
# not built here: `make publish` builds, signs and publishes them from the
# release machine (see docs/build.md, "Publish").

on:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build check (Linux)
    runs-on: docker
    container:
      image: git.thoxy.xyz/thoxy/dayz-community-hub/ci:latest
      credentials:
        username: ${{ forgejo.repository_owner }}
        password: ${{ secrets.FORGEJO_TOKEN }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Cache Cargo registry and build artifacts
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust tests
        env:
          CARGO_BUILD_JOBS: "4"
        run: cargo test --workspace

      - name: Clippy
        env:
          CARGO_BUILD_JOBS: "4"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Assets, layers and parity floor
        run: cargo xtask assets && cargo xtask layers && cargo xtask parity --check

      - name: Windows check
        env:
          CARGO_BUILD_JOBS: "4"
        run: cargo xwin check -p dz-hub -p dayz-community-hub --target x86_64-pc-windows-msvc
